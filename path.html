  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "CertQuests Learning Paths",
    "description": "Duolingo-style guided learning paths for 56 IT certifications.",
    "url": "https://certquests.com/path.html",
    "isPartOf": { "@type": "WebSite", "name": "CertQuests", "url": "https://certquests.com" }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/main.css?v=135" />
  <link rel="stylesheet" href="/src/styles/desktop.css?v=135" />
  <link rel="stylesheet" href="/src/styles/path.css?v=135" />
</head>
<body>
  <a href="#main-content" class="skip-to-main" style="position:absolute;left:-9999px;top:8px">Skip to main content</a>

  <header class="web-header">
    <a href="/" class="web-header-logo">
      <img src="/src/assets/icons/favicon-96.png?v=4" alt="CertQuests" class="web-header-bolt" width="32" height="32">
      CertQuests
    </a>
    <nav class="web-header-links" aria-label="Main navigation">
      <a href="/path.html" class="web-header-link-new" aria-current="page">Cert Quest<span class="web-header-link-pill">NEW</span></a>
      <a href="/certifications/">Certifications</a>
      <a href="/courses/">Courses</a>
      <a href="/careers/">Careers</a>
    </nav>
  </header>

  <main id="main-content" class="path-page">
    <!-- Splash skeleton — content-shaped placeholder so the page paints
         instantly with the right layout instead of a spinner + text label.
         Replaced by the real .path-content once src/path.js boots. -->
    <div class="path-page-loading" id="path-loading" aria-busy="true" aria-label="Loading your path">
      <div class="path-skel-header">
        <span class="path-skel path-skel-eyebrow"></span>
        <span class="path-skel path-skel-title"></span>
        <div class="path-skel-stats">
          <span class="path-skel path-skel-stat"></span>
          <span class="path-skel path-skel-stat"></span>
          <span class="path-skel path-skel-stat"></span>
        </div>
      </div>
      <div class="path-skel-map" aria-hidden="true">
        <span class="path-skel path-skel-node"></span>
        <span class="path-skel path-skel-node"></span>
        <span class="path-skel path-skel-node"></span>
        <span class="path-skel path-skel-node"></span>
        <span class="path-skel path-skel-node"></span>
        <span class="path-skel path-skel-node"></span>
      </div>
    </div>
    <div class="path-page-error" id="path-error" hidden>
      <h2>Path not found</h2>
      <p id="path-error-msg"></p>
      <a href="/certifications/" class="cta-primary">Browse the exam list →</a>
    </div>

    <article class="path-content" id="path-root" hidden>
      <header class="path-header">
        <div class="path-header-eyebrow" id="path-eyebrow">Learning Path</div>
        <h1 class="path-title" id="path-title">—</h1>
        <div class="path-stats">
          <span class="path-stat" title="Chapters"><span class="path-stat-icon">📚</span> <span id="path-chapters">—</span></span>
          <span class="path-stat" title="Total nodes"><span class="path-stat-icon">🎯</span> <span id="path-nodes">—</span></span>
          <span class="path-stat" title="Your progress"><span class="path-stat-icon">⚡</span> <span id="path-progress">0%</span></span>
          <span class="path-stat" id="path-cohort" title="Cohort average accuracy vs. yours" hidden><span class="path-stat-icon">👥</span> <span id="path-cohort-val">—</span></span>
        </div>
        <a href="/path.html?pick=1" class="path-change-link" aria-label="Choose a different certification path">&#8596; Change path</a>
        <a href="/profile.html" class="path-class-chip" id="path-class-chip" aria-label="Your RPG class" hidden></a>
      </header>
      <section class="path-map" id="path-map" aria-label="Learning path map"></section>
    </article>
  </main>

  <!-- Node detail bottom-sheet -->
  <div class="node-sheet" id="node-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="node-sheet-title">
    <div class="node-sheet-backdrop"></div>
    <div class="node-sheet-panel">
      <button type="button" class="node-sheet-close" aria-label="Close">✕</button>
      <div class="node-sheet-icon" id="node-sheet-icon"></div>
      <div class="node-sheet-kind" id="node-sheet-kind"></div>
      <h2 id="node-sheet-title">—</h2>
      <p id="node-sheet-desc" class="node-sheet-desc"></p>
      <div class="node-sheet-meta" id="node-sheet-meta"></div>
      <button type="button" class="cta-primary node-sheet-start" id="node-sheet-start">Start →</button>
    </div>
  </div>

  <script src="/src/cq-core.js?v=135" defer></script>
  <script src="/src/mascot-loader.js?v=135" defer></script>
  <script src="/src/path-progress.js?v=135" defer></script>
  <script src="/src/path.js?v=135" defer></script>
  <script type="module" src="/src/auth.js?v=135"></script>
  <script src="/src/auth-ui.js?v=135" defer></script>
  <script src="/src/sync.js?v=135" defer></script>
</body>
</html>
