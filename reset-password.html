<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07091a" />
  <meta name="robots" content="noindex,follow" />
  <title>Reset password — CertQuests</title>
  <meta name="description" content="Set a new password for your CertQuests account." />
  <link rel="canonical" href="https://certquests.com/reset-password.html" />

  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles/main.css?v=122" />
  <link rel="stylesheet" href="/src/styles/desktop.css?v=122" />
</head>
<body>
  <header class="web-header">
    <a href="/" class="web-header-logo">
      <img src="/src/assets/icons/favicon-96.png?v=4" alt="CertQuests" class="web-header-bolt" width="32" height="32">
      CertQuests
    </a>
    <nav class="web-header-links" aria-label="Main navigation">
      <a href="/path.html" class="web-header-link-new">Cert Quest<span class="web-header-link-pill">NEW</span></a>
      <a href="/certifications/">Certifications</a>
      <a href="/courses/">Courses</a>
      <a href="/careers/">Careers</a>
    </nav>
  </header>

  <main class="reset-page">
    <section class="reset-card">
      <div class="reset-eyebrow">Account recovery</div>
      <h1 id="reset-title">Set a new password</h1>
      <p class="reset-sub" id="reset-sub">Verifying your reset link…</p>

      <!-- Form (shown once the recovery session is active) -->
      <form class="reset-form" id="reset-form" hidden autocomplete="off">
        <label class="reset-label" for="reset-password">New password</label>
        <input class="reset-input" id="reset-password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••" />
        <label class="reset-label" for="reset-confirm">Confirm new password</label>
        <input class="reset-input" id="reset-confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••" />
        <button type="submit" class="cta-primary reset-submit">Update password →</button>
        <div class="reset-message" id="reset-message" hidden></div>
      </form>

      <!-- Invalid / expired link state -->
      <div class="reset-invalid" id="reset-invalid" hidden>
        <p>This reset link is invalid or has expired (typically after 1 hour).</p>
        <a class="cta-primary" href="/">Back to home</a>
      </div>
    </section>
  </main>

  <style>
    /* Inline styles — tiny, page-specific, avoids editing main.css for a
       single-purpose page that 99% of users never visit. */
    .reset-page {
      max-width: 460px;
      margin: 60px auto 40px;
      padding: 0 20px;
    }
    .reset-card {
      background: linear-gradient(180deg, #0e1424 0%, #07091a 100%);
      border: 1px solid rgba(96,165,250,0.20);
      border-radius: 18px;
      padding: 30px 28px 26px;
      box-shadow: 0 20px 60px -10px rgba(0,0,0,0.55);
    }
    .reset-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 4px;
    }
    .reset-card h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      color: #f1f5fb;
    }
    .reset-sub {
      font-size: 14px;
      line-height: 1.55;
      color: #a8b6d1;
      margin: 0 0 22px;
    }
    .reset-form { display: flex; flex-direction: column; gap: 8px; }
    .reset-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7c90ae;
    }
    .reset-input {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      color: #e8edf8;
      font-size: 15px;
      font-family: inherit;
    }
    .reset-input:focus {
      outline: none;
      border-color: rgba(96,165,250,0.5);
      background: rgba(96,165,250,0.06);
    }
    .reset-submit {
      margin-top: 8px;
      padding: 13px 18px;
      font-size: 15px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .reset-submit:hover { box-shadow: 0 6px 22px rgba(59,130,246,0.40); }
    .reset-submit:disabled { opacity: 0.5; cursor: progress; }
    .reset-message {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .reset-message--ok {
      background: rgba(34,197,94,0.10);
      border: 1px solid rgba(74,222,128,0.30);
      color: #bbf7d0;
    }
    .reset-message--err {
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(248,113,113,0.30);
      color: #fecaca;
    }
    .reset-invalid p {
      color: #fca5a5;
      font-size: 14px;
      margin: 0 0 16px;
    }
    .reset-invalid .cta-primary {
      display: inline-block;
      padding: 11px 18px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>

  <script type="module" src="/src/auth.js?v=122"></script>
  <script src="/src/reset-password.js?v=122" defer></script>
</body>
</html>
