<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="50%" stop-color="#0c1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Decorative glow circle -->
  <circle cx="280" cy="250" r="200" fill="url(#accent)" opacity="0.08"/>
  <circle cx="280" cy="250" r="120" fill="url(#accent)" opacity="0.06"/>
  <!-- App icon -->
  <rect x="200" y="140" width="160" height="160" rx="36" ry="36" fill="url(#accent)"/>
  <path d="M292 162 L237 215 L261 215 L252 298 L308 245 L284 245 Z" fill="url(#bolt)"/>
  <!-- App name -->
  <text x="420" y="215" font-family="Outfit, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">CertQuest</text>
  <!-- Tagline -->
  <text x="420" y="258" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="400" fill="#7c90ae">Master IT Certifications — CCNA, AWS, Azure &amp; more</text>
  <!-- Feature pills -->
  <rect x="420" y="285" width="100" height="30" rx="15" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="445" y="305" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" fill="#3b82f6">Free</text>
  <rect x="532" y="285" width="130" height="30" rx="15" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="554" y="305" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" fill="#10b981">1000+ Qs</text>
  <rect x="674" y="285" width="110" height="30" rx="15" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="694" y="305" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" fill="#8b5cf6">Offline</text>
  <!-- Bottom tag -->
  <text x="420" y="380" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#3d4f6a" letter-spacing="2">CCNA · AWS · AZURE · COMPTIA · TERRAFORM · FORTINET</text>
</svg>
