# Vertical shorts published as Reels on the "CertsQuests" Facebook page and Instagram @certquets, four times a week.
# Each run renders the day's calendar slot (scripts/shorts-video.cjs: Mon, Wed, Fri, Sun from 2026-11-30) with an
# English voice-over, music and subtitles, then publishes it (scripts/shorts-publish.cjs). YouTube Shorts are
# scheduled ahead from the shorts-weekly artifact. Same secrets as social-weekly.
# Manual run: check = token rights · dry-run = render without publishing · publish = render + publish.
name: shorts-publish

on:
  schedule:
    # 16:00 UTC (17:00 in Paris in winter) on Monday, Wednesday, Friday and Sunday.
    - cron: "0 16 * * 0,1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = token rights · dry-run = render without publishing · publish = render + publish"
        type: choice
        options: [dry-run, check, publish]
        default: dry-run
      slot:
        description: "Slot YYYY-MM-DD (empty = today's)"
        type: string
        default: ""
      only:
        description: "Limit to one platform (fb or ig, empty = both)"
        type: string
        default: ""
      fb_video:
        description: "With only=ig: id of the already published Facebook Reel that Instagram reuses"
        type: string
        default: ""

concurrency:
  group: shorts-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODE: ${{ inputs.mode || 'publish' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ffmpeg, fonts and sharp
        if: env.MODE != 'check'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          sudo apt-get install -y -qq fonts-inter fonts-jetbrains-mono || echo "optional fonts unavailable, DejaVu fallback"
          npm install --no-save --no-package-lock sharp@0.35

      - name: Token rights
        run: node scripts/shorts-publish.cjs --check

      - name: Render the slot
        if: env.MODE != 'check'
        run: >
          node scripts/shorts-video.cjs --out shorts-out --require-voice
          ${{ inputs.slot != '' && inputs.slot && format('--slot {0}', inputs.slot) || '' }}

      - name: Publish to Facebook + Instagram
        if: env.MODE != 'check'
        run: >
          node scripts/shorts-publish.cjs --dir shorts-out
          ${{ env.MODE == 'dry-run' && '--dry-run' || '' }}
          ${{ inputs.only != '' && inputs.only && format('--only {0}', inputs.only) || '' }}
          ${{ inputs.fb_video != '' && inputs.fb_video && format('--fb-video {0}', inputs.fb_video) || '' }}

      - uses: actions/upload-artifact@v4
        if: always() && env.MODE != 'check'
        with:
          name: shorts-publish
          path: shorts-out/
          retention-days: 30
          if-no-files-found: ignore
