# Batch render of the shorts calendar (scripts/shorts-video.cjs) with voice-over, music and subtitles: the MP4s,
# their .srt and captions go to the "shorts" artifact. Used to schedule YouTube Shorts (and TikTok) ahead;
# Facebook and Instagram are published by shorts-publish. Monday: the week's 4 slots. By hand: any period.
name: shorts-weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      from:
        description: "First day YYYY-MM-DD (empty = today)"
        type: string
        default: ""
      count:
        description: "Number of slots to render"
        type: string
        default: "4"
      pick:
        description: "Instead of the calendar: format:id list (e.g. concept:lacp,quiz:az-900)"
        type: string
        default: ""
      tts_speed:
        description: "Test only: OpenAI TTS speed (empty = the script's default)"
        type: string
        default: ""
      tts_model:
        description: "Test only: OpenAI TTS model (empty = the script's default)"
        type: string
        default: ""
      tts_voice:
        description: "Test only: OpenAI voice (empty = ash)"
        type: string
        default: ""
      tts_mode:
        description: "Test only: sentence (default) or flow (one-take narration)"
        type: string
        default: ""

concurrency:
  # Hand-picked samples get their own queue so they don't wait behind a 12-video batch.
  group: shorts-weekly-${{ inputs.pick != '' && 'pick' || 'batch' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ffmpeg, fonts and sharp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          sudo apt-get install -y -qq fonts-inter fonts-jetbrains-mono || echo "optional fonts unavailable, DejaVu fallback"
          npm install --no-save --no-package-lock sharp@0.35

      - name: Render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FROM: ${{ inputs.from }}
          COUNT: ${{ inputs.count }}
          PICK: ${{ inputs.pick }}
          OPENAI_TTS_SPEED: ${{ inputs.tts_speed }}
          OPENAI_TTS_MODEL: ${{ inputs.tts_model }}
          OPENAI_TTS_VOICE: ${{ inputs.tts_voice }}
          SHORTS_TTS_MODE: ${{ inputs.tts_mode }}
        run: |
          if [ -n "$PICK" ]; then
            node scripts/shorts-video.cjs --out shorts-out --require-voice --pick "$PICK"
          else
            [ -z "$FROM" ] && FROM=$(date -u +%F)
            [ -z "$COUNT" ] && COUNT=4
            node scripts/shorts-video.cjs --out shorts-out --require-voice --from "$FROM" --count "$COUNT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: shorts-out/
          retention-days: 30
