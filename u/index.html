  <style>
    .pp-page { max-width: 720px; margin: 0 auto; padding: 0 20px 80px; }
    .breadcrumb { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#506885; padding:14px 0 0; }
    .breadcrumb a { color:#7c90ae; text-decoration:none; }
    .breadcrumb span { color:#3d4f6a; margin:0 8px; }

    .pp-card {
      margin-top: 22px;
      background: linear-gradient(135deg, rgba(96,165,250,.06), rgba(167,139,250,.05));
      border: 1px solid rgba(96,165,250,.20);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
    }
    .pp-avatar { font-size: 64px; line-height: 1; margin-bottom: 8px; }
    .pp-name { font-family:'Space Grotesk',sans-serif; font-size: clamp(22px,4vw,30px); font-weight: 800; color:#f1f5fb; letter-spacing:-.02em; margin: 0 0 4px; }
    .pp-level { font-family:'JetBrains Mono',monospace; font-size: 12px; letter-spacing:.1em; text-transform: uppercase; color:#fbbf24; }
    .pp-stats { display:flex; justify-content:center; gap: clamp(16px,5vw,40px); flex-wrap:wrap; margin: 22px 0 6px; }
    .pp-stat strong { display:block; font-family:'Space Grotesk',sans-serif; font-size: 24px; font-weight:800; color:#60a5fa; }
    .pp-stat span { font-size: 11px; text-transform:uppercase; letter-spacing:.08em; color:#7c90ae; }
    .pp-since { font-size: 12px; color:#506885; margin-top: 10px; }

    .pp-section { margin-top: 26px; text-align:left; }
    .pp-section h2 { font-family:'JetBrains Mono',monospace; font-size: 11px; letter-spacing:.14em; text-transform:uppercase; color:#7c90ae; margin:0 0 12px; }
    .pp-laurels { display:flex; flex-wrap:wrap; gap: 8px; }
    .pp-laurel {
      display:inline-flex; align-items:center; gap:6px;
      font-family:'Space Grotesk',sans-serif; font-size: 13px; font-weight:700; color:#f1f5fb;
      background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.30);
      padding: 7px 13px; border-radius: 999px;
    }
    .pp-laurels-empty { color:#7c90ae; font-size: 13.5px; }

    .pp-cta { margin-top: 30px; text-align:center; }
    .pp-cta a {
      display:inline-flex; align-items:center; gap:8px;
      background:#3b82f6; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
      padding: 13px 26px; border-radius: 13px; text-decoration:none; transition: filter .15s, transform .15s;
    }
    .pp-cta a:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .pp-follow {
      display:inline-flex; align-items:center; gap:6px; margin-bottom:12px;
      background:#a855f7; color:#fff; border:none; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
      padding:12px 24px; border-radius:13px; cursor:pointer; transition: filter .15s, transform .15s;
    }
    .pp-follow:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .pp-follow.is-following { background:transparent; color:#c4b5fd; border:1px solid rgba(168,85,247,.5); }
    .pp-share { margin-top: 12px; }
    .pp-share button {
      background: transparent; border:1px solid rgba(255,255,255,.14); color:#cfd6e6;
      font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:10px; cursor:pointer;
    }
    .pp-share button.copied { color:#34d399; border-color: rgba(52,211,153,.45); }

    .pp-state { text-align:center; padding: 64px 20px; color:#7c90ae; }
    .pp-state strong { color:#f1f5fb; display:block; font-family:'Space Grotesk',sans-serif; font-size: 18px; margin-bottom: 8px; }
    .pp-state a { color:#60a5fa; text-decoration:none; }
  </style>
</head>

    </div>
  </footer>

  <script>
  (function () {
    var SUPABASE_URL  = 'https://zhxnteqtiyqnyidfkivj.supabase.co';
    var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoeG50ZXF0aXlxbnlpZGZraXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODM4MzgsImV4cCI6MjA5NDE1OTgzOH0.0cv1X3saQSdQFZe-JeNmE3etOeudZvKuHnBx6CkBQGo';
    var root = document.getElementById('pp-root');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtNum(n) { return (Number(n) || 0).toLocaleString('en-US'); }
    function getHandle() {
      var m = /[?&]u=([^&]+)/.exec(location.search);
      return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')).trim() : '';
    }
    function stageEmoji(level) {
      if (window.cqStats && window.cqStats.stageEmojiForLevel) return window.cqStats.stageEmojiForLevel(level);
      return '🏆';
    }

    function renderState(html) { root.innerHTML = '<div class="pp-state">' + html + '</div>'; }

    var handle = getHandle();
    if (!handle) {
      renderState('<strong>No profile specified</strong>Add <code>?u=username</code> to the URL, or browse the <a href="/leaderboard/">leaderboard</a>.');
      return;
    }

    // Pack id → display name (best-effort; falls back to a prettified id).
    function loadPackNames() {
      return fetch('/data/index.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (idx) {
        var map = {};
        if (idx && Array.isArray(idx.brands)) {
          idx.brands.forEach(function (b) {
            (b.packs || []).forEach(function (p) { if (p && p.id) map[p.id] = p.short || p.name || p.id; });
          });
        }
        return map;
      }).catch(function () { return {}; });
    }
    function prettyPack(id) { return String(id || '').split('-').map(function (s) { return s.toUpperCase(); }).join(' '); }

    function authClient() { return window.cqAuth && window.cqAuth._client; }
    function myUsername() { try { return (localStorage.getItem('cq-profile-username') || '').trim(); } catch (_) { return ''; } }

    /* Follow button (Phase 7.10): hidden by default; shown when this isn't
       your own profile. Signed-out clicks open the sign-in modal. */
    function wireFollow(targetHandle) {
      var btn = document.getElementById('pp-follow');
      if (!btn) return;
      var following = false;

      function paint() {
        btn.hidden = false;
        btn.textContent = following ? '✓ Following' : '＋ Follow';
        btn.classList.toggle('is-following', following);
      }
      function ready() {
        // Hide on your own profile.
        if (myUsername() && myUsername().toLowerCase() === targetHandle.toLowerCase()) { btn.hidden = true; return; }
        var c = authClient();
        if (c && window.cqAuth.getUser && window.cqAuth.getUser()) {
          c.rpc('social_search_users', { p_q: targetHandle, limit_n: 12 }).then(function (r) {
            var rows = (r && r.data) || [];
            var match = rows.filter(function (u) { return u.username && u.username.toLowerCase() === targetHandle.toLowerCase(); })[0];
            following = !!(match && match.following);
            paint();
          }).catch(function () { paint(); });
        } else {
          paint(); // signed out — show Follow; click will prompt sign-in
        }
      }

      btn.addEventListener('click', function () {
        var c = authClient();
        if (!c || !(window.cqAuth.getUser && window.cqAuth.getUser())) {
          if (window.cqAuthUi && window.cqAuthUi.openSignIn) window.cqAuthUi.openSignIn();
          return;
        }
        btn.disabled = true;
        c.rpc('social_follow', { p_username: targetHandle, p_follow: !following }).then(function (r) {
          btn.disabled = false;
          if (r && r.error) return;
          if (r && r.data === false) return;
          following = !following; paint();
        }).catch(function () { btn.disabled = false; });
      });

      window.addEventListener('cq:auth-changed', ready);
      setTimeout(ready, 120);
    }

    Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/rpc/get_public_profile', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ handle: handle })
      }).then(function (r) { return r.ok ? r.json() : []; }),
      loadPackNames()
    ]).then(function (res) {
      var rows = res[0] || [];
      var nameMap = res[1] || {};
      var p = Array.isArray(rows) ? rows[0] : rows;
      if (!p) {
        renderState('<strong>This profile is private or doesn\'t exist</strong>The player may not have turned on their public leaderboard profile. <a href="/leaderboard/">See who has →</a>');
        return;
      }
      document.title = (p.display_name || 'Player') + ' — CertQuests profile';
      var laurels = Array.isArray(p.laurel_packs) ? p.laurel_packs : [];
      var since = p.member_since ? new Date(p.member_since) : null;
      var sinceTxt = since ? since.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) : '';

      var laurelsHtml = laurels.length
        ? laurels.map(function (id) { return '<span class="pp-laurel">🏆 ' + esc(nameMap[id] || prettyPack(id)) + '</span>'; }).join('')
        : '<p class="pp-laurels-empty">No final-boss exams cleared yet.</p>';

      root.innerHTML =
        '<div class="pp-card">' +
          '<div class="pp-avatar" aria-hidden="true">' + esc(stageEmoji(p.level || 1)) + '</div>' +
          '<h1 class="pp-name">' + esc(p.display_name || 'Anonymous') + '</h1>' +
          '<div class="pp-level">Level ' + (Number(p.level) || 1) + '</div>' +
          '<div class="pp-stats">' +
            '<div class="pp-stat"><strong>' + fmtNum(p.xp) + '</strong><span>XP</span></div>' +
            '<div class="pp-stat"><strong>' + laurels.length + '</strong><span>Certs survived</span></div>' +
            '<div class="pp-stat"><strong>' + fmtNum(p.nodes_completed) + '</strong><span>Lessons cleared</span></div>' +
          '</div>' +
          (sinceTxt ? '<div class="pp-since">On CertQuests since ' + esc(sinceTxt) + '</div>' : '') +
        '</div>' +
        '<div class="pp-section">' +
          '<h2>🏆 Certifications survived</h2>' +
          '<div class="pp-laurels">' + laurelsHtml + '</div>' +
        '</div>' +
        '<div class="pp-cta">' +
          '<button type="button" id="pp-follow" class="pp-follow" hidden>＋ Follow</button>' +
          '<a href="/certifications/">Build your own profile — free →</a>' +
          '<div class="pp-share"><button type="button" id="pp-copy">🔗 Copy link to this profile</button></div>' +
        '</div>';

      wireFollow(handle);

      var copyBtn = document.getElementById('pp-copy');
      if (copyBtn) copyBtn.addEventListener('click', function () {
        var url = location.href;
        (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(url) : Promise.reject())
          .then(function () { copyBtn.textContent = '✓ Link copied'; copyBtn.classList.add('copied'); })
          .catch(function () { copyBtn.textContent = url; });
      });
    }).catch(function () {
      renderState('<strong>Couldn\'t load this profile</strong>Try again in a moment.');
    });
  })();
  </script>

  <script src="/src/cq-core.js?v=118" defer></script>

  <script src="/src/mascot-loader.js?v=118" defer></script>
</body>
