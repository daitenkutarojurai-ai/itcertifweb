  <style>
    .gd-page { max-width: 820px; margin: 0 auto; padding: 0 20px 80px; }
    .breadcrumb { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#506885; padding:14px 0 0; }
    .breadcrumb a { color:#7c90ae; text-decoration:none; }
    .breadcrumb span { color:#3d4f6a; margin:0 8px; }

    .gd-hero { padding: 28px 6px 8px; }
    .gd-hero h1 { font-family:'Space Grotesk',sans-serif; font-size:clamp(26px,4.4vw,38px); font-weight:800; letter-spacing:-.02em; margin:0 0 6px; color:#f1f5fb; }
    .gd-hero h1 .grad { background:linear-gradient(135deg,#34d399,#60a5fa,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .gd-hero p { font-size:15px; color:#9eb0cc; line-height:1.6; max-width:620px; margin:0; }

    .gd-card { background:#0c1120; border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:18px; margin-top:18px; }
    .gd-card h2 { font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; color:#f1f5fb; margin:0 0 12px; }

    .gd-tag { display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:30px; padding:0 8px;
      font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:#06080f;
      background:linear-gradient(135deg,#34d399,#60a5fa); border-radius:8px; letter-spacing:.04em; }

    .gd-mine { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .gd-mine-body { flex:1; min-width:160px; }
    .gd-mine-name { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:18px; color:#f1f5fb; }
    .gd-mine-meta { font-family:'JetBrains Mono',monospace; font-size:12px; color:#7c90ae; margin-top:3px; }
    .gd-mine-rank { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:22px; color:#fbbf24; }

    table.gd-table { width:100%; border-collapse:collapse; font-size:13.5px; }
    .gd-table thead th { padding:10px 12px; text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#7c90ae; border-bottom:1px solid rgba(255,255,255,.06); }
    .gd-table tbody td { padding:11px 12px; border-bottom:1px solid rgba(255,255,255,.04); color:#bfcfe5; }
    .gd-table tbody tr:last-child td { border-bottom:none; }
    .gd-table tbody tr.is-me { background:rgba(52,211,153,.05); }
    .gd-rank { font-family:'JetBrains Mono',monospace; font-weight:700; color:#7c90ae; width:44px; }
    .gd-rank.gold{color:#fbbf24}.gd-rank.silver{color:#cbd5e1}.gd-rank.bronze{color:#f97316}
    .gd-gname { font-family:'Space Grotesk',sans-serif; font-weight:700; color:#f1f5fb; }
    .gd-gname a { color:inherit; text-decoration:none; }
    .gd-gname a:hover { color:#60a5fa; }
    .gd-xp { font-family:'JetBrains Mono',monospace; font-weight:700; color:#34d399; text-align:right; }
    .gd-num { font-family:'JetBrains Mono',monospace; color:#a8b6d1; text-align:right; }

    .gd-form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .gd-input { flex:1; min-width:140px; padding:11px 13px; background:#070b16; border:1px solid rgba(255,255,255,.1); border-radius:10px; color:#e8edf8; font-family:inherit; font-size:14px; outline:none; }
    .gd-input:focus { border-color:rgba(96,165,250,.6); box-shadow:0 0 0 3px rgba(96,165,250,.16); }
    .gd-input.tag { flex:0 0 90px; min-width:90px; text-transform:uppercase; }
    .gd-btn { background:#3b82f6; color:#fff; border:none; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; padding:11px 20px; border-radius:10px; cursor:pointer; transition:filter .15s,transform .15s; white-space:nowrap; }
    .gd-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
    .gd-btn:disabled { opacity:.5; cursor:default; transform:none; filter:none; }
    .gd-btn.secondary { background:transparent; border:1px solid rgba(255,255,255,.14); color:#cfd6e6; }
    .gd-btn.danger { background:transparent; border:1px solid rgba(248,113,113,.4); color:#fca5a5; }
    .gd-hint { font-size:12.5px; color:#7c90ae; margin:8px 0 0; }
    .gd-err { color:#fca5a5; font-size:13px; margin-top:8px; }
    .gd-state { text-align:center; padding:40px 18px; color:#7c90ae; }
    .gd-divider { font-family:'JetBrains Mono',monospace; font-size:11px; color:#3d4f6a; text-transform:uppercase; letter-spacing:.1em; text-align:center; margin:14px 0; }
    .gd-back { font-family:'JetBrains Mono',monospace; font-size:12px; color:#7c90ae; text-decoration:none; }
  </style>

  <script>
  (function () {
    var SUPABASE_URL  = 'https://zhxnteqtiyqnyidfkivj.supabase.co';
    var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoeG50ZXF0aXlxbnlpZGZraXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODM4MzgsImV4cCI6MjA5NDE1OTgzOH0.0cv1X3saQSdQFZe-JeNmE3etOeudZvKuHnBx6CkBQGo';
    var root = document.getElementById('gd-root');
    var myGuildSlug = null; // resolved when signed in

    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function fmt(n){return (Number(n)||0).toLocaleString('en-US');}
    function client(){return window.cqAuth && window.cqAuth._client;}
    function uid(){return window.cqAuth && window.cqAuth.getUser && (window.cqAuth.getUser()||{}).id;}
    function rankClass(r){return r===1?'gold':r===2?'silver':r===3?'bronze':'';}
    function rankIcon(r){return r===1?'🥇':r===2?'🥈':r===3?'🥉':'#'+r;}
    function getSlugParam(){var m=/[?&]g=([^&]+)/.exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g,' ')).trim():'';}

    // Public reads via anon REST.
    function rpcAnon(name, body){
      return fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{
        method:'POST',
        headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify(body||{})
      }).then(function(r){return r.ok?r.json():[];});
    }
    // Authed reads/writes via the supabase-js client.
    function rpcAuth(name, args){
      var c=client(); if(!c) return Promise.reject(new Error('not signed in'));
      return c.rpc(name, args||{}).then(function(r){ if(r.error) throw new Error(r.error.message); return r.data; });
    }

    function refreshMyGuild(){
      if(!uid()) { myGuildSlug=null; return Promise.resolve(null); }
      return rpcAuth('get_my_guild').then(function(rows){
        var row = Array.isArray(rows)?rows[0]:rows;
        myGuildSlug = row ? row.slug : null;
        return row;
      }).catch(function(){ myGuildSlug=null; return null; });
    }

    /* ── Detail view: /guilds/?g=slug ─────────────────────────────── */
    function renderDetail(slug){
      root.innerHTML = '<div class="gd-state">Loading guild…</div>';
      Promise.all([ rpcAnon('get_guild',{p_slug:slug}), refreshMyGuild() ]).then(function(res){
        var rows = res[0]||[];
        if(!rows.length){ root.innerHTML='<div class="gd-card"><a class="gd-back" href="/guilds/">← All guilds</a><div class="gd-state"><strong>Guild not found.</strong></div></div>'; return; }
        var h = rows[0];
        var roster = rows.filter(function(r){return r.member_name!=null;});
        var rosterHtml = roster.map(function(r,i){
          var me = uid() && myGuildSlug===slug && false; // can't match by name reliably; highlight skipped
          return '<tr><td class="gd-rank '+rankClass(i+1)+'">'+rankIcon(i+1)+'</td>'+
            '<td class="gd-gname">'+esc(r.member_name)+(r.member_role==='owner'?' <span style="color:#fbbf24;font-size:11px">★ owner</span>':'')+'</td>'+
            '<td class="gd-num">L'+(Number(r.member_level)||1)+'</td>'+
            '<td class="gd-xp">'+fmt(r.member_xp)+' XP</td></tr>';
        }).join('');
        var action='';
        if(uid()){
          if(myGuildSlug===slug) action='<button type="button" class="gd-btn danger" id="gd-leave">Leave guild</button>';
          else if(myGuildSlug) action='<p class="gd-hint">You\'re already in <a style="color:#60a5fa" href="/guilds/?g='+encodeURIComponent(myGuildSlug)+'">another guild</a> — leave it first to join this one.</p>';
          else action='<button type="button" class="gd-btn" id="gd-join">Join '+esc(h.tag)+'</button>';
        } else {
          action='<button type="button" class="gd-btn" id="gd-signin">Sign in to join</button>';
        }
        root.innerHTML =
          '<div class="gd-card"><a class="gd-back" href="/guilds/">← All guilds</a>'+
          '<div class="gd-mine" style="margin-top:12px">'+
            '<span class="gd-tag" style="height:44px;min-width:60px;font-size:18px">'+esc(h.tag)+'</span>'+
            '<div class="gd-mine-body"><div class="gd-mine-name">'+esc(h.name)+'</div>'+
              '<div class="gd-mine-meta">'+fmt(h.member_count)+' member'+(Number(h.member_count)===1?'':'s')+' · '+fmt(h.total_xp)+' total XP</div></div>'+
          '</div>'+
          (h.description?'<p class="gd-hint">'+esc(h.description)+'</p>':'')+
          '<div style="margin-top:14px">'+action+'</div><div class="gd-err" id="gd-err"></div></div>'+
          '<div class="gd-card"><h2>Roster</h2><table class="gd-table"><thead><tr><th>#</th><th>Member</th><th style="text-align:right">Lvl</th><th style="text-align:right">XP</th></tr></thead><tbody>'+rosterHtml+'</tbody></table></div>';
        wireDetailActions(slug);
      });
    }

    function wireDetailActions(slug){
      var err=document.getElementById('gd-err');
      var join=document.getElementById('gd-join');
      var leave=document.getElementById('gd-leave');
      var signin=document.getElementById('gd-signin');
      if(signin) signin.addEventListener('click',function(){ if(window.cqAuthUi&&window.cqAuthUi.openSignIn) window.cqAuthUi.openSignIn(); });
      if(join) join.addEventListener('click',function(){
        join.disabled=true;
        rpcAuth('join_guild',{p_slug:slug}).then(function(){ renderDetail(slug); }).catch(function(e){ join.disabled=false; if(err) err.textContent=e.message; });
      });
      if(leave) leave.addEventListener('click',function(){
        if(!confirm('Leave this guild?')) return;
        leave.disabled=true;
        rpcAuth('leave_guild').then(function(){ myGuildSlug=null; renderDetail(slug); }).catch(function(e){ leave.disabled=false; if(err) err.textContent=e.message; });
      });
    }

    /* ── Index view: /guilds/ ─────────────────────────────────────── */
    function renderIndex(){
      Promise.all([ rpcAnon('get_guild_leaderboard',{limit_n:100}), refreshMyGuild() ]).then(function(res){
        var board = res[0]||[];
        var mine = res[1];
        var mineHtml='';
        if(uid()){
          if(mine){
            mineHtml='<div class="gd-card"><h2>Your guild</h2><div class="gd-mine">'+
              '<span class="gd-tag">'+esc(mine.tag)+'</span>'+
              '<div class="gd-mine-body"><div class="gd-mine-name"><a style="color:inherit;text-decoration:none" href="/guilds/?g='+encodeURIComponent(mine.slug)+'">'+esc(mine.name)+'</a></div>'+
                '<div class="gd-mine-meta">'+fmt(mine.member_count)+' member'+(Number(mine.member_count)===1?'':'s')+' · '+fmt(mine.total_xp)+' XP'+(mine.role==='owner'?' · ★ owner':'')+'</div></div>'+
              '<div style="text-align:right"><div class="gd-mine-rank">#'+fmt(mine.rank)+'</div><div class="gd-mine-meta">rank</div></div>'+
            '</div></div>';
          } else {
            mineHtml='<div class="gd-card"><h2>Start or join a guild</h2>'+
              '<div class="gd-form-row"><input class="gd-input" id="gd-name" maxlength="30" placeholder="Guild name (3–30 chars)" />'+
                '<input class="gd-input tag" id="gd-tagin" maxlength="5" placeholder="TAG" /><button type="button" class="gd-btn" id="gd-create">Create</button></div>'+
              '<div class="gd-divider">— or join one —</div>'+
              '<div class="gd-form-row"><input class="gd-input" id="gd-slug" placeholder="Guild code (slug), e.g. cloud-crew" /><button type="button" class="gd-btn secondary" id="gd-joinslug">Join</button></div>'+
              '<p class="gd-hint">You can be in one guild at a time. Tip: pick a guild from the leaderboard below and open it to join.</p>'+
              '<div class="gd-err" id="gd-err"></div></div>';
          }
        } else {
          mineHtml='<div class="gd-card"><h2>Team up</h2><p class="gd-hint">Sign in to create a guild or join one, then pool your XP with your team.</p>'+
            '<div style="margin-top:10px"><button type="button" class="gd-btn" id="gd-signin">Sign in</button></div></div>';
        }

        var boardHtml = board.length
          ? '<table class="gd-table"><thead><tr><th>#</th><th>Guild</th><th style="text-align:right">Members</th><th style="text-align:right">XP</th></tr></thead><tbody>'+
            board.map(function(g,i){
              var me = mine && mine.slug===g.slug;
              return '<tr'+(me?' class="is-me"':'')+'><td class="gd-rank '+rankClass(i+1)+'">'+rankIcon(i+1)+'</td>'+
                '<td class="gd-gname"><span class="gd-tag" style="height:22px;min-width:34px;font-size:11px;margin-right:8px;vertical-align:middle">'+esc(g.tag)+'</span>'+
                  '<a href="/guilds/?g='+encodeURIComponent(g.slug)+'">'+esc(g.name)+'</a></td>'+
                '<td class="gd-num">'+fmt(g.member_count)+'</td><td class="gd-xp">'+fmt(g.total_xp)+'</td></tr>';
            }).join('')+'</tbody></table>'
          : '<div class="gd-state">No guilds yet — be the first to create one.</div>';

        root.innerHTML =
          '<section class="gd-hero"><h1>Join a <span class="grad">guild</span></h1>'+
          '<p>Team up with other learners and pool your XP. Your guild climbs the leaderboard as every member studies.</p></section>'+
          mineHtml +
          '<div class="gd-card"><h2>🏆 Guild leaderboard</h2>'+boardHtml+'</div>';
        wireIndexActions();
      });
    }

    function wireIndexActions(){
      var err=function(){return document.getElementById('gd-err');};
      var signin=document.getElementById('gd-signin');
      if(signin) signin.addEventListener('click',function(){ if(window.cqAuthUi&&window.cqAuthUi.openSignIn) window.cqAuthUi.openSignIn(); });
      var create=document.getElementById('gd-create');
      if(create) create.addEventListener('click',function(){
        var name=(document.getElementById('gd-name').value||'').trim();
        var tag=(document.getElementById('gd-tagin').value||'').trim();
        create.disabled=true; if(err()) err().textContent='';
        rpcAuth('create_guild',{p_name:name,p_tag:tag}).then(function(slug){ location.href='/guilds/?g='+encodeURIComponent(slug); }).catch(function(e){ create.disabled=false; if(err()) err().textContent=e.message; });
      });
      var joinslug=document.getElementById('gd-joinslug');
      if(joinslug) joinslug.addEventListener('click',function(){
        var slug=(document.getElementById('gd-slug').value||'').trim();
        if(!slug){ if(err()) err().textContent='Enter a guild code.'; return; }
        joinslug.disabled=true; if(err()) err().textContent='';
        rpcAuth('join_guild',{p_slug:slug}).then(function(){ location.href='/guilds/?g='+encodeURIComponent(slug.toLowerCase()); }).catch(function(e){ joinslug.disabled=false; if(err()) err().textContent=e.message; });
      });
    }

    function route(){
      var slug=getSlugParam();
      if(slug) renderDetail(slug); else renderIndex();
    }

    route();
    // Re-render once auth resolves (sign in/out) so authed sections appear.
    var lastUid = uid();
    window.addEventListener('cq:auth-changed', function(){
      var now = uid();
      if(now !== lastUid){ lastUid = now; route(); }
    });
  })();
  </script>
